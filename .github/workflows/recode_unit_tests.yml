name: recode-unit-tests

on:
  pull_request:
    branches:
      - codex/prepare-implementation-plan-for-recode-extraction

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: app/requirements.txt
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
      - name: Run recode tests
        working-directory: app
        run: |
          python manage.py migrate
          python manage.py test recode_extraction
